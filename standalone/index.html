<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>송민서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  :root {
    --bg: #FFFFFF;
    --sub: #F8F3DF;
    --btn: #45BFD8;
    --btn-text: #102A34;
    --btn-hover: #2FAAC4;
    --btn-active: #E84E5F;
    --btn-active-text: #FFFFFF;
    --ink: #16242B;
    --muted: #6E7C84;
    --icon: #333333;
    --quiet: #ECEFF1;
    --quiet-hover: #DDE3E6;
    --quiet-text: #33444C;
    --shadow-s: 0 1px 3px rgba(16, 42, 52, .10);
    --shadow-m: 0 4px 16px rgba(16, 42, 52, .08);
    --shadow-l: 0 30px 80px rgba(16, 42, 52, .28);
    --pad: 10%;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
                 system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  button { font-family: inherit; }
  a { color: inherit; }

  /* 페이지 좌우 여백 10% — 어느 영역에서도 같은 값을 씁니다 */
  .shell { padding-left: var(--pad); padding-right: var(--pad); }

  /* ── 상단 바 (높이 80px, 아래 선 없음) ───────────────────────────── */
  .navbar {
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-btn {
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    line-height: 0;
  }
  .logo-btn img, .logo-btn svg { height: 48px; width: auto; display: block; }
  .social { display: flex; align-items: center; gap: 18px; }
  .social a {
    color: var(--icon);
    display: inline-flex;
    opacity: .78;
    transition: opacity .18s ease, transform .18s ease;
  }
  .social a:hover { opacity: 1; transform: translateY(-1px); }
  .social svg { width: 24px; height: 24px; display: block; }

  /* ── 본문 레이아웃 (사이드바 + 내용) ──────────────────────────── */
  .layout {
    display: flex;
    gap: 34px;
    align-items: flex-start;
    padding-bottom: 72px;
    min-height: 60vh;
  }

  .sidebar {
    width: 120px;
    flex: 0 0 120px;
    background: var(--sub);
    border-radius: 20px;
    padding: 14px 10px;
    display: flex;
    flex-direction: column;
    min-height: 540px;
    position: sticky;
    top: 16px;
  }
  .sidebar-spacer { flex: 1 1 auto; }
  .nav-btn {
    width: 100%;
    background: transparent;
    border: 0;
    border-radius: 14px;
    padding: 12px 4px;
    margin-bottom: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: var(--ink);
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: background .18s ease, color .18s ease;
  }
  .nav-btn svg { width: 24px; height: 24px; }
  .nav-btn:hover { background: rgba(16, 42, 52, .07); }
  .nav-btn.is-active {
    background: var(--btn-active);
    color: var(--btn-active-text);
  }
  .nav-btn.is-create { margin-bottom: 14px; }

  .main { flex: 1 1 auto; min-width: 0; }

  .page-head { margin: 4px 0 22px; }
  .page-head h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
  .page-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

  /* ── 버튼 ─────────────────────────────────────────────────────── */
  .btn {
    background: var(--btn);
    color: var(--btn-text);
    border: 0;
    border-radius: 12px;
    padding: 10px 18px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    transition: background .18s ease, color .18s ease;
  }
  .btn:hover { background: var(--btn-hover); }
  .btn.is-active { background: var(--btn-active); color: var(--btn-active-text); }
  .btn.is-active:hover { background: var(--btn-active); }
  .btn-quiet { background: var(--quiet); color: var(--quiet-text); }
  .btn-quiet:hover { background: var(--quiet-hover); }
  .btn svg { width: 16px; height: 16px; }
  .btn[disabled] { opacity: .55; cursor: default; }

  /* ── 메이슨리 그리드 ──────────────────────────────────────────── */
  .masonry { column-width: 240px; column-gap: 20px; }
  .card {
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    page-break-inside: avoid;
    display: inline-block;
    width: 100%;
    margin: 0 0 20px;
    background: var(--bg);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow-m);
    cursor: pointer;
    text-align: left;
    padding: 0;
    border: 0;
    transition: transform .22s ease, box-shadow .22s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(16, 42, 52, .14); }
  .card-media { position: relative; line-height: 0; background: var(--sub); }
  .card-media img, .card-media video { width: 100%; height: auto; display: block; }
  .card-overlay {
    position: absolute;
    inset: 0;
    background: rgba(16, 42, 52, 0);
    transition: background .35s ease;
  }
  .card:hover .card-overlay { background: rgba(16, 42, 52, .34); }
  .card-placeholder {
    background: var(--sub);
    aspect-ratio: 4 / 3;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 16px;
    line-height: 1.4;
  }
  .card-placeholder .ph-title { font-weight: 800; font-size: 16px; }
  .card-placeholder .ph-meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .card-body { padding: 12px 14px 15px; }
  .card-title { font-weight: 700; font-size: 15px; line-height: 1.35; }
  .card-meta { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .empty { color: var(--muted); padding: 30px 0; }
  .notice {
    background: var(--sub);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .notice strong { display: block; margin-bottom: 4px; }
  .notice span { color: var(--muted); font-size: 14px; }

  /* ── 상세 모달 ────────────────────────────────────────────────── */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(16, 42, 52, .55);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 5vh 20px;
    overflow-y: auto;
    z-index: 60;
    opacity: 0;
    transition: opacity .22s ease;
  }
  .backdrop.is-open { opacity: 1; }
  .modal {
    background: var(--bg);
    border-radius: 20px;
    width: 100%;
    max-width: 680px;
    box-shadow: var(--shadow-l);
    overflow: hidden;
    position: relative;
    opacity: 0;
    transform: scale(.94);
    transition: transform .26s cubic-bezier(.2, .8, .3, 1), opacity .26s ease;
  }
  .backdrop.is-open .modal { opacity: 1; transform: scale(1); }
  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 0;
    background: rgba(255, 255, 255, .94);
    box-shadow: var(--shadow-m);
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }
  .modal-close svg { width: 18px; height: 18px; }
  .modal-media { line-height: 0; }
  /* 세로로 아주 긴 표지여도 제목이 화면 밖으로 밀리지 않게 높이만 제한합니다.
     contain 이므로 잘리지 않고 남는 자리는 Sub 색으로 채워집니다. */
  .modal-media img, .modal-media video {
    width: 100%;
    height: auto;
    max-height: 60vh;
    object-fit: contain;
    background: var(--sub);
    display: block;
    border-radius: 20px 20px 0 0;
  }
  .modal-embed { position: relative; width: 100%; padding-top: 56.25%; }
  .modal-embed iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 20px 20px 0 0;
  }
  .modal-body { padding: 24px 26px 6px; }
  .modal-title { font-size: 24px; font-weight: 800; margin: 0; line-height: 1.3; letter-spacing: -.01em; }
  .modal-meta { color: var(--muted); margin-top: 6px; font-size: 14px; }
  .modal-text { margin-top: 16px; white-space: pre-wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip {
    background: var(--sub);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 13px;
    color: var(--quiet-text);
  }
  .modal-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
  }
  .modal-actions .domain { color: var(--muted); font-size: 14px; }
  .modal-footer {
    padding: 16px 26px 24px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* ── 프로필 ───────────────────────────────────────────────────── */
  .profile-grid { display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; }
  .profile-left { flex: 0 1 40%; min-width: 260px; max-width: 700px; }
  .profile-right { flex: 1 1 320px; min-width: 260px; }
  .avatar {
    width: 100%;
    max-width: 700px;
    aspect-ratio: 1 / 1;
    background: var(--sub);
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 14px;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar-gap { height: 4px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .field .value { font-size: 16px; }
  input[type="text"], input[type="email"], input[type="password"], textarea, select {
    width: 100%;
    background: #FFFFFF;
    color: var(--ink);
    border: 0;
    border-radius: 12px;
    padding: 11px 14px;
    font-family: inherit;
    font-size: 15px;
    box-shadow: var(--shadow-s);
    outline: none;
  }
  input:focus, textarea:focus { box-shadow: 0 0 0 2px var(--btn); }
  textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
  input[type="file"] { font-size: 13px; color: var(--muted); max-width: 100%; }

  .resume-box { margin-top: 26px; }
  .resume-preview { margin-top: 10px; background: #FFFFFF; border-radius: 14px; box-shadow: var(--shadow-s); padding: 10px; }
  .resume-preview img { max-height: 380px; max-width: 100%; height: auto; display: block; margin: 0 auto; object-fit: contain; }
  .resume-preview iframe { width: 100%; height: 420px; border: 0; background: #FFFFFF; border-radius: 10px; display: block; }
  .link-inline { color: var(--muted); font-size: 14px; display: inline-block; margin-top: 8px; }

  /* ── 관리(Create) 페이지 ──────────────────────────────────────── */
  .segmented { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .form { max-width: 640px; }
  .form .field { margin-bottom: 18px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .form-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 24px; }
  .status { margin-top: 16px; font-size: 14px; }
  .status.is-error { color: #B3283A; }
  .status.is-ok { color: #1F7A4D; }
  .login-card { background: var(--sub); border-radius: 18px; padding: 24px; max-width: 420px; }

  /* ── 푸터 ─────────────────────────────────────────────────────── */
  .footer {
    background: var(--sub);
    padding-top: 32px;
    padding-bottom: 32px;
    color: var(--quiet-text);
    font-size: 14px;
    line-height: 1.9;
  }
  .footer .admin-link {
    background: none;
    border: 0;
    padding: 0;
    margin-top: 10px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    display: block;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ── 반응형 ───────────────────────────────────────────────────── */
  @media (max-width: 1000px) { :root { --pad: 6%; } }

  @media (max-width: 860px) {
    .layout { flex-direction: column; gap: 22px; }
    .sidebar {
      width: 100%;
      flex: 0 0 auto;
      min-height: 0;
      position: static;
      flex-direction: row;
      gap: 6px;
      overflow-x: auto;
      padding: 10px;
    }
    .sidebar-spacer { flex: 0 0 8px; }
    /* 가로 배치에서는 width:100% 를 풀어야 버튼 네 개가 한 줄에 들어갑니다. */
    .nav-btn { width: auto; margin-bottom: 0; flex: 1 1 0; min-width: 0; font-size: 14px; padding: 10px 4px; }
    .nav-btn.is-create { margin-bottom: 0; margin-left: auto; }
    .profile-grid { gap: 26px; }
    .profile-left { flex: 1 1 100%; }
  }

  @media (max-width: 560px) {
    :root { --pad: 20px; }
    .navbar { height: 72px; }
    .social { gap: 14px; }
    .masonry { column-width: 160px; column-gap: 14px; }
    .card { margin-bottom: 14px; }
    .modal-body { padding: 20px 18px 6px; }
    .modal-footer { padding: 14px 18px 20px; }
    .modal-title { font-size: 21px; }
    .page-head h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<header class="navbar shell">
  <button class="logo-btn" id="logoBtn" aria-label="Home"></button>
  <nav class="social" id="social" aria-label="Social links"></nav>
</header>

<div class="layout shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>

<footer class="footer shell">

<script>
(function () {

     아래 코드 어디에서도 주소나 키를 직접 쓰지 않습니다.

  /* ══════════════════════════════════════════════════════════════════

  /* TPC 로고 — 파일(VITE_LOGO_SRC)이 없으면 이 내장 SVG로 대체됩니다.

  const LOGO_SVG =
    '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TPC">' +
      '<rect width="120" height="120" rx="28" fill="#1659D6"/>' +

      '<path d="M60 41.5 L63.6 50.4 L72.5 54 L63.6 57.6 L60 66.5 L56.4 57.6 L47.5 54 L56.4 50.4 Z" fill="#1659D6"/>' +

        'letter-spacing="1.5" font-family="Pretendard, system-ui, sans-serif">TPC</text>' +

  /* ══════════════════════════════════════════════════════════════════
     Supabase 연결 — 공개(publishable) 키만 사용합니다.
     쓰기 권한은 서버의 RLS 정책이 막습니다. (supabase/portfolio-v3.sql)
     ══════════════════════════════════════════════════════════════════ */

  function looksLikeSecretKey(key) {
    if (!key) return false;
    if (key.indexOf("sb_secret_") === 0) return true;
    const parts = key.split(".");
    if (parts.length === 3) {
      try {
        const payload = JSON.parse(atob(parts[1].replace(/-/g, "+").replace(/_/g, "/")));
        if (payload && payload.role === "service_role") return true;
      } catch (e) { /* JWT 가 아니면 검사할 것이 없습니다 */ }
    }
    return false;
  }

  function detectConfigError() {
    const missing = [];
    if (!VITE_SUPABASE_URL) missing.push("VITE_SUPABASE_URL");
    if (!VITE_SUPABASE_PUBLISHABLE_KEY) missing.push("VITE_SUPABASE_PUBLISHABLE_KEY");
    if (!VITE_SUPABASE_STORAGE_BUCKET) missing.push("VITE_SUPABASE_STORAGE_BUCKET");
    if (missing.length) {
      return { title: "Supabase 설정이 아직 입력되지 않았습니다.",
               detail: "이 파일 맨 위의 설정값을 채워 주세요: " + missing.join(", ") };
    }
    if (looksLikeSecretKey(VITE_SUPABASE_PUBLISHABLE_KEY)) {
      return { title: "보안 위험: 비밀키가 입력되어 연결을 중단했습니다.",
               detail: "VITE_SUPABASE_PUBLISHABLE_KEY 에는 service_role / secret key 를 넣을 수 없습니다. " +
                       "이 파일의 값은 브라우저에 그대로 노출되므로 Publishable(anon) key 로 바꿔 주세요." };
    }
    if (!/^https:\/\/[^\s/]+\.supabase\.co\/?$/i.test(VITE_SUPABASE_URL)) {
      return { title: "Supabase 주소 형식이 올바르지 않습니다.",
               detail: "VITE_SUPABASE_URL 은 https://프로젝트ID.supabase.co 형식이어야 합니다. (.com 이 아닙니다)" };
    }
    return null;
  }

  const configError = detectConfigError();
  let supa = null;
  if (!configError) {
    try {
      supa = window.supabase.createClient(VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true }
      });
    } catch (e) {
      // createClient 가 실패해도 흰 화면이 되지 않도록 안내 문구로 넘깁니다.
      supa = null;
    }
  }

  /* ══════════════════════════════════════════════════════════════════
     작은 도구들
     ══════════════════════════════════════════════════════════════════ */

  function esc(v) {
    if (v === null || v === undefined) return "";
    return String(v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function trim(v) { return (v === null || v === undefined) ? "" : String(v).trim(); }
  function joinMeta(parts) { return parts.map(trim).filter(Boolean).join(" · "); }
  function $(id) { return document.getElementById(id); }
  function toTop() { window.scrollTo(0, 0); }

  function domainOf(url) {
    const u = trim(url);
    if (!u) return "";
    try { return new URL(u).hostname.replace(/^www\./i, ""); }
    catch (e) { return u.replace(/^https?:\/\//i, "").split("/")[0]; }
  }

  /* 주소 앞에 https:// 를 붙이고 http/https 인지 검사합니다. */
  function normalizeUrl(raw) {
    let v = trim(raw);
    if (!v) return { ok: true, value: null };
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v = "https://" + v;
    if (!/^https?:\/\//i.test(v)) return { ok: false, value: null };
    try {
      const parsed = new URL(v);
      if (!parsed.hostname || parsed.hostname.indexOf(".") === -1) return { ok: false, value: null };
      return { ok: true, value: parsed.href };
    } catch (e) { return { ok: false, value: null }; }
  }

  /* 유튜브 주소(watch / youtu.be / shorts / embed)에서 영상 id 를 뽑습니다. */
  function youtubeId(url) {
    const u = trim(url);
    if (!u) return null;
    const m = u.match(
      /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/i
    );
    return m ? m[1] : null;
  }
  function youtubeThumb(id) { return "https://img.youtube.com/vi/" + id + "/hqdefault.jpg"; }
  function youtubeEmbed(id) { return "https://www.youtube.com/embed/" + id; }

  function safeFileName(file) {
    const dot = file.name.lastIndexOf(".");
    const ext = dot > -1 ? file.name.slice(dot + 1).toLowerCase().replace(/[^a-z0-9]/g, "") : "";
    const stamp = Date.now();
    const rand = Math.random().toString(36).slice(2, 8);
    return ext ? stamp + "-" + rand + "." + ext : String(stamp) + "-" + rand;
  }

  const ALLOWED_FOLDERS = ["images", "videos", "games", "papers", "records", "profile", "resumes"];

  async function uploadFile(file, folder) {
    if (!supa) throw new Error("Supabase 에 연결되어 있지 않습니다.");
    const root = folder.split("/")[0];
    if (ALLOWED_FOLDERS.indexOf(root) === -1) throw new Error("허용되지 않은 업로드 폴더입니다: " + folder);
    const path = folder + "/" + safeFileName(file);
    const { error } = await supa.storage.from(VITE_SUPABASE_STORAGE_BUCKET)
      .upload(path, file, { cacheControl: "3600", upsert: false });
    if (error) throw error;
    return path;
  }

  function publicUrl(path) {
    if (!path || !supa) return null;
    const { data } = supa.storage.from(VITE_SUPABASE_STORAGE_BUCKET).getPublicUrl(path);
    return (data && data.publicUrl) || null;
  }

  /* 저장(DB 쓰기)이 실패하면 방금 올린 파일을 지웁니다. */
  async function removeUploaded(paths) {
    if (!supa || !paths.length) return;
    try { await supa.storage.from(VITE_SUPABASE_STORAGE_BUCKET).remove(paths); }
    catch (e) { /* 정리 실패는 사용자에게 보여줄 오류보다 덜 중요합니다 */ }
  }

  function checkFile(file, kindList, label) {
    const name = file.name.toLowerCase();
    const ok = kindList.some(function (ext) { return name.endsWith(ext); });
    if (!ok) throw new Error(label + " 형식은 " + kindList.join(", ") + " 만 가능합니다.");
  }
  const IMAGE_EXT = [".png", ".jpg", ".jpeg", ".webp"];
  const VIDEO_EXT = [".mp4"];
  const RESUME_EXT = [".pdf", ".png", ".jpg", ".jpeg", ".webp"];

  /* 깨진 이미지는 빈칸을 남기지 않고 지웁니다. */
  window.__mediaFail = function (img) {
    const media = img.closest(".card-media, .modal-media");
    if (media) media.remove();
  };

  /* ══════════════════════════════════════════════════════════════════
     상태
     ══════════════════════════════════════════════════════════════════ */

  const KINDS = {
    game:   { table: "games",   label: "Game",   page: "games",   folder: "games" },
    paper:  { table: "papers",  label: "Paper",  page: "papers",  folder: "papers" },
    record: { table: "records", label: "Record", page: "records", folder: "records" }
  };

  const state = {
    page: "profile",
    session: null,
    isAdmin: false,
    loading: true,
    loadError: null,
    games: [], papers: [], records: [],
    profile: null,
    formKind: "game",
    editing: null,          // { kind, row }
    draft: { title: "", description: "", year: "" },  // 종류를 바꿔도 남는 공통 입력
    localAvatar: null,      // 저장 전 미리보기 (objectURL)
    localResume: null,      // { url, name }
    profileDraft: null      // 저장 전에 화면을 다시 그려도 입력한 글이 남도록 보관
  };

  function itemsOf(kind) {
    if (kind === "game") return state.games;
    if (kind === "paper") return state.papers;
    return state.records;
  }
  function findItem(kind, id) {
    return itemsOf(kind).filter(function (r) { return r.id === id; })[0] || null;
  }

  /* ══════════════════════════════════════════════════════════════════
     데이터 읽기
     ══════════════════════════════════════════════════════════════════ */

  async function loadAll() {
    if (!supa) { state.loading = false; return; }
    state.loading = true;
    state.loadError = null;
    try {
      const [g, p, r, pr] = await Promise.all([
        supa.from("games").select("*").order("created_at", { ascending: false }),
        supa.from("papers").select("*").order("created_at", { ascending: false }),
        supa.from("records").select("*").order("created_at", { ascending: false }),
        supa.from("profile").select("*").order("updated_at", { ascending: false }).limit(1)
      ]);
      const firstError = [g, p, r, pr].filter(function (res) { return res.error; })[0];
      if (firstError) throw firstError.error;
      state.games = g.data || [];
      state.papers = p.data || [];
      state.records = r.data || [];
      state.profile = (pr.data && pr.data[0]) || null;
    } catch (e) {
      state.loadError = e.message || "데이터를 불러오지 못했습니다.";
    } finally {
      state.loading = false;
    }
  }

  /* ══════════════════════════════════════════════════════════════════
     상단 바 · 사이드바
     ══════════════════════════════════════════════════════════════════ */

  function renderChrome() {
    const logo = $("logoBtn");
    if (!logo.dataset.ready) {
      logo.dataset.ready = "1";
      const img = new Image();
      img.onload = function () { logo.innerHTML = ""; logo.appendChild(img); };
      img.onerror = function () { logo.innerHTML = LOGO_SVG; };
      img.alt = "TPC";
      img.src = VITE_LOGO_SRC;
      logo.innerHTML = LOGO_SVG;
      logo.addEventListener("click", function () { go("profile"); });
    }

    const social = $("social");
    if (!social.dataset.ready) {
      social.dataset.ready = "1";
      social.innerHTML = [
        ["YouTube", VITE_YOUTUBE_CHANNEL_URL, ICONS.youtube],
        ["Instagram", VITE_INSTAGRAM_URL, ICONS.instagram],
        ["Threads", VITE_THREADS_URL, ICONS.threads]
      ].map(function (s) {
        return '<a href="' + esc(s[1]) + '" target="_blank" rel="noopener noreferrer" ' +
               'aria-label="' + esc(s[0]) + '" title="' + esc(s[0]) + '">' + s[2] + '</a>';
      }).join("");
    }
  }

  function renderSidebar() {
    const nav = [
      ["profile", "Profile", ICONS.person],
      ["games", "Games", ICONS.game],
      ["papers", "Papers", ICONS.paper],
      ["records", "Records", ICONS.record]
    ];
    let html = nav.map(function (n) {
      return '<button class="nav-btn' + (state.page === n[0] ? " is-active" : "") +
             '" data-go="' + n[0] + '">' + n[2] + '<span>' + n[1] + '</span></button>';
    }).join("");

    html += '<div class="sidebar-spacer"></div>';
    if (state.isAdmin) {
      html += '<button class="nav-btn is-create' + (state.page === "create" ? " is-active" : "") +
              '" data-go="create">' + ICONS.plus + '<span>Create</span></button>';
    }
    $("sidebar").innerHTML = html;
  }

  function go(page) {
    state.page = page;
    render();
    toTop();
  }

  /* ══════════════════════════════════════════════════════════════════
     카드 · 메이슨리
     ══════════════════════════════════════════════════════════════════ */

  function coverOf(kind, row) {
    const direct = trim(row.cover_image_url);
    if (direct) return direct;
    if (kind === "game") {
      const yid = youtubeId(row.youtube_url);
      if (yid) return youtubeThumb(yid);
    }
    return "";
  }

  function metaOf(kind, row) {
    if (kind === "game") return joinMeta([row.year, row.role, row.project_type]);
    if (kind === "paper") return joinMeta([row.venue, row.year]);
    return joinMeta([domainOf(row.url)]);
  }

  function cardHTML(kind, row) {
    const title = trim(row.title) || "(제목 없음)";
    const meta = metaOf(kind, row);
    const cover = coverOf(kind, row);
    const video = kind === "game" ? trim(row.video_url) : "";

    let media = "";
    let hasCover = true;
    if (video) {
      // 영상이 있으면 카드 자체가 영상입니다. 마우스를 올리면 소리 없이 재생됩니다.
      media = '<div class="card-media" data-video="1">' +
                '<video muted loop playsinline preload="metadata"' +
                (cover ? ' poster="' + esc(cover) + '"' : "") +
                ' src="' + esc(video) + '"></video>' +
                '<div class="card-overlay"></div>' +
              '</div>';
    } else if (cover) {
      media = '<div class="card-media">' +
                '<img src="' + esc(cover) + '" alt="" loading="lazy" onerror="window.__mediaFail(this)">' +
                '<div class="card-overlay"></div>' +
              '</div>';
    } else {
      // 표지가 없어도 절대 보이지 않는 항목이 없도록 4:3 카드로 채웁니다.
      // 이 안에 제목과 설명이 이미 들어가므로 아래 card-body 는 만들지 않습니다.
      hasCover = false;
      media = '<div class="card-placeholder">' +
                '<div class="ph-title">' + esc(title) + '</div>' +
                (meta ? '<div class="ph-meta">' + esc(meta) + '</div>' : "") +
              '</div>';
    }

    const body = hasCover
      ? '<div class="card-body">' +
          '<div class="card-title">' + esc(title) + '</div>' +
          (meta ? '<div class="card-meta">' + esc(meta) + '</div>' : "") +
        '</div>'
      : "";

    return '<button class="card" data-kind="' + kind + '" data-id="' + esc(row.id) + '">' +
             media + body +
           '</button>';
  }

  function listPage(kind, heading, blurb) {
    const rows = itemsOf(kind);
    let html = '<div class="page-head"><h1>' + esc(heading) + '</h1>' +
               (blurb ? '<p>' + esc(blurb) + '</p>' : "") + '</div>';
    html += statusNotice();
    if (!state.loading && !state.loadError && !rows.length) {
      html += '<div class="empty">아직 등록된 항목이 없습니다.</div>';
    } else if (rows.length) {
      html += '<div class="masonry">' + rows.map(function (r) { return cardHTML(kind, r); }).join("") + '</div>';
    }
    return html;
  }

  function statusNotice() {
    if (configError) {
      return '<div class="notice"><strong>' + esc(configError.title) + '</strong>' +
             '<span>' + esc(configError.detail) + '</span></div>';
    }
    if (!supa) {
      return '<div class="notice"><strong>Supabase 연결을 만들지 못했습니다.</strong>' +
             '<span>이 파일 맨 위의 설정값을 다시 확인해 주세요.</span></div>';
    }
    if (state.loading) return '<div class="empty">불러오는 중입니다…</div>';
    if (state.loadError) {
      return '<div class="notice"><strong>데이터를 불러오지 못했습니다.</strong>' +
             '<span>' + esc(state.loadError) + '</span></div>';
    }
    return "";
  }

  /* 마우스를 올리면 영상 재생, 벗어나면 멈추고 처음으로 되돌립니다. */
  function bindHoverVideos(root) {
    const nodes = root.querySelectorAll('.card-media[data-video="1"]');
    Array.prototype.forEach.call(nodes, function (node) {
      const v = node.querySelector("video");
      if (!v) return;
      const card = node.closest(".card");
      card.addEventListener("mouseenter", function () {
        const playing = v.play();
        if (playing && playing.catch) playing.catch(function () { /* 자동재생 차단은 무시 */ });
      });
      card.addEventListener("mouseleave", function () {
        v.pause();
        try { v.currentTime = 0; } catch (e) { /* 아직 로드 전이면 무시 */ }
      });
    });
  }

  /* ══════════════════════════════════════════════════════════════════
     상세 모달
     ══════════════════════════════════════════════════════════════════ */

  function modalMedia(kind, row) {
    if (kind === "game") {
      const video = trim(row.video_url);
      if (video) {
        return '<div class="modal-media"><video controls playsinline src="' + esc(video) + '"></video></div>';
      }
      const yid = youtubeId(row.youtube_url);
      if (yid) {
        return '<div class="modal-media modal-embed"><iframe src="' + esc(youtubeEmbed(yid)) +
               '" title="video" allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture" ' +
               'allowfullscreen loading="lazy"></iframe></div>';
      }
    }
    const cover = trim(row.cover_image_url);
    if (cover) {
      return '<div class="modal-media"><img src="' + esc(cover) +
             '" alt="" onerror="window.__mediaFail(this)"></div>';
    }
    return "";   // 미디어가 없으면 영역 자체를 만들지 않아 빈칸이 생기지 않습니다.
  }

  function modalBody(kind, row) {
    const title = trim(row.title) || "(제목 없음)";
    let html = '<h2 class="modal-title">' + esc(title) + '</h2>';

    const meta = metaOf(kind, row);
    if (meta) html += '<div class="modal-meta">' + esc(meta) + '</div>';

    const text = trim(kind === "paper" ? row.abstract : row.description);
    if (text) html += '<div class="modal-text">' + esc(text) + '</div>';

    if (kind === "paper") {
      const kws = trim(row.keywords).split(",").map(trim).filter(Boolean);
      if (kws.length) {
        html += '<div class="chips">' + kws.map(function (k) {
          return '<span class="chip">' + esc(k) + '</span>';
        }).join("") + '</div>';
      }
    }

    const actions = [];
    if (kind === "record") {
      const url = trim(row.url);
      if (url) {
        actions.push('<a class="btn btn-quiet" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' +
                     ICONS.external + 'Visit site</a>');
        actions.push('<span class="domain">' + esc(domainOf(url)) + '</span>');
      }
    }
    if (kind === "paper") {
      const pdf = trim(row.pdf_url);
      if (pdf) actions.push('<a class="btn btn-quiet" href="' + esc(pdf) + '" target="_blank" rel="noopener noreferrer">' +
                            ICONS.external + 'Open PDF</a>');
      const link = trim(row.link_url);
      if (link) actions.push('<a class="btn btn-quiet" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">' +
                             ICONS.external + 'Visit link</a>');
    }
    if (kind === "game") {
      const link = trim(row.link_url);
      if (link) actions.push('<a class="btn btn-quiet" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">' +
                             ICONS.external + 'Visit link</a>');
    }
    if (actions.length) html += '<div class="modal-actions">' + actions.join("") + '</div>';

    return html;
  }

  function openModal(kind, id) {
    const row = findItem(kind, id);
    if (!row) return;

    const footer = state.isAdmin
      ? '<div class="modal-footer">' +
          '<button class="btn btn-quiet" data-edit="1">Edit</button>' +
          '<button class="btn btn-quiet" data-delete="1">Delete</button>' +
        '</div>'
      : "";

    const root = $("modalRoot");
    root.innerHTML =
      '<div class="backdrop" role="dialog" aria-modal="true">' +
        '<div class="modal">' +
          '<button class="modal-close" aria-label="Close">' + ICONS.close + '</button>' +
          modalMedia(kind, row) +
          '<div class="modal-body">' + modalBody(kind, row) + '</div>' +
          footer +
        '</div>' +
      '</div>';

    const backdrop = root.querySelector(".backdrop");
    // 스타일을 한 번 확정시킨 뒤 클래스를 붙여야 전환(페이드 + 확대)이 실제로 일어납니다.
    // requestAnimationFrame 은 탭이 화면 뒤에 있을 때 실행되지 않아 쓰지 않습니다.
    void backdrop.offsetWidth;
    backdrop.classList.add("is-open");

    function close() {
      backdrop.classList.remove("is-open");
      setTimeout(function () { root.innerHTML = ""; }, 240);
      document.removeEventListener("keydown", onKey);
    }
    function onKey(e) { if (e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);

    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) close(); });
    root.querySelector(".modal-close").addEventListener("click", close);

    const editBtn = root.querySelector("[data-edit]");
    if (editBtn) editBtn.addEventListener("click", function () { close(); startEdit(kind, row); });

    const delBtn = root.querySelector("[data-delete]");
    if (delBtn) delBtn.addEventListener("click", async function () {
      if (!window.confirm("정말 삭제할까요? 되돌릴 수 없습니다.")) return;
      delBtn.disabled = true;
      const { error } = await supa.from(KINDS[kind].table).delete().eq("id", row.id);
      if (error) { delBtn.disabled = false; window.alert("삭제하지 못했습니다: " + error.message); return; }
      close();
      await loadAll();
      go(KINDS[kind].page);
    });
  }

  /* ══════════════════════════════════════════════════════════════════
     Profile 페이지 (첫 화면)
     ══════════════════════════════════════════════════════════════════ */

  function profileValue(key) {
    // 아직 저장하지 않은 입력이 있으면 그 값을 먼저 씁니다.
    if (state.profileDraft && Object.prototype.hasOwnProperty.call(state.profileDraft, key)) {
      return state.profileDraft[key];
    }
    const stored = state.profile ? trim(state.profile[key]) : "";
    return stored || PROFILE_DEFAULTS[key] || "";
  }

  /* 화면을 다시 그리기 전에 입력칸의 내용을 보관합니다. */
  function captureProfileDraft() {
    if (!state.isAdmin) return;
    const n = $("pf_name"), b = $("pf_bio"), i = $("pf_interests");
    if (!n || !b || !i) return;
    state.profileDraft = { name: n.value, bio: b.value, interests: i.value };
  }

  function resumePreviewHTML(url, name) {
    const u = trim(url);
    if (!u) return "";
    const lower = (name || u).toLowerCase().split("?")[0];
    let inner;
    if (/\.(png|jpe?g|webp)$/.test(lower)) {
      inner = '<img src="' + esc(u) + '" alt="resume" onerror="this.style.display=\'none\'">';
    } else if (/\.pdf$/.test(lower)) {
      inner = '<iframe src="' + esc(u) + '" title="resume"></iframe>';
    } else {
      inner = '<a class="link-inline" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">open file</a>';
    }
    return '<div class="resume-preview">' + inner + '</div>';
  }

  function profilePage() {
    const admin = state.isAdmin;
    const p = state.profile || {};
    const avatarUrl = state.localAvatar || trim(p.profile_image_url);

    let html = '<div class="page-head"><h1>Profile</h1></div>';
    html += statusNotice();
    html += '<div class="profile-grid">';

    /* 왼쪽: 정사각 프로필 이미지 → 4px 간격 → Image upload 버튼 */
    html += '<div class="profile-left">';
    html +=   '<div class="avatar">' +
                (avatarUrl
                  ? '<img src="' + esc(avatarUrl) + '" alt="profile" onerror="this.style.display=\'none\'">'
                  : '<span>no image</span>') +
              '</div>';
    html +=   '<div class="avatar-gap"></div>';
    if (admin) {
      html += '<button class="btn" id="avatarBtn">Image upload</button>' +
              '<input type="file" id="avatarInput" class="sr-only" accept=".png,.jpg,.jpeg,.webp">';
    }
    html += '</div>';

    /* 오른쪽: 이름 / 한 줄 소개 / 관심 분야 + 이력서 */
    html += '<div class="profile-right">';
    const fields = [["name", "이름"], ["bio", "한 줄 소개"], ["interests", "관심 분야"]];
    fields.forEach(function (f) {
      html += '<div class="field"><label for="pf_' + f[0] + '">' + esc(f[1]) + '</label>';
      html += admin
        ? '<input type="text" id="pf_' + f[0] + '" value="' + esc(profileValue(f[0])) + '">'
        : '<div class="value">' + esc(profileValue(f[0])) + '</div>';
      html += '</div>';
    });

    html += '<div class="resume-box">';
    html +=   '<div class="field"><label>Resume</label>';
    if (admin) {
      html +=   '<input type="file" id="resumeInput" accept=".pdf,.png,.jpg,.jpeg,.webp">' +
                '<div class="hint">.pdf · .png · .jpg · .jpeg · .webp</div>';
    }
    html +=   '</div>';

    if (state.localResume) {
      html += '<div class="hint">선택한 파일: ' + esc(state.localResume.name) + ' (저장 전 미리보기)</div>';
      html += resumePreviewHTML(state.localResume.url, state.localResume.name);
    } else if (trim(p.resume_url)) {
      html += resumePreviewHTML(p.resume_url, p.resume_url);
      html += '<a class="link-inline" href="' + esc(trim(p.resume_url)) +
              '" target="_blank" rel="noopener noreferrer">Open in new tab</a>';
    } else if (!admin) {
      html += '<div class="hint">등록된 이력서가 없습니다.</div>';
    }
    html += '</div>';

    if (admin) {
      html += '<div class="form-actions"><button class="btn" id="profileSave">Save</button></div>';
      html += '<div class="status" id="profileStatus"></div>';
    }
    html += '</div></div>';
    return html;
  }

  function bindProfile() {
    if (!state.isAdmin) return;

    const avatarBtn = $("avatarBtn");
    const avatarInput = $("avatarInput");
    if (avatarBtn && avatarInput) {
      avatarBtn.addEventListener("click", function () { avatarInput.click(); });
      avatarInput.addEventListener("change", function () {
        const f = avatarInput.files[0];
        if (!f) return;
        // 저장 전에 바로 미리보기를 띄웁니다.
        if (state.localAvatar) URL.revokeObjectURL(state.localAvatar);
        state.localAvatar = URL.createObjectURL(f);
        window.__pendingAvatar = f;
        const img = document.querySelector(".avatar img");
        const av = document.querySelector(".avatar");
        if (img) { img.src = state.localAvatar; img.style.display = ""; }
        else if (av) { av.innerHTML = '<img src="' + esc(state.localAvatar) + '" alt="profile">'; }
      });
    }

    const resumeInput = $("resumeInput");
    if (resumeInput) {
      resumeInput.addEventListener("change", function () {
        const f = resumeInput.files[0];
        if (!f) return;
        if (state.localResume) URL.revokeObjectURL(state.localResume.url);
        state.localResume = { url: URL.createObjectURL(f), name: f.name };
        window.__pendingResume = f;
        captureProfileDraft();   // 입력한 글을 잃지 않도록 먼저 보관합니다
        renderMain();            // 그런 다음 미리보기를 새로 그립니다
      });
    }

    const saveBtn = $("profileSave");
    if (saveBtn) saveBtn.addEventListener("click", saveProfile);
  }

  async function saveProfile() {
    const status = $("profileStatus");
    const btn = $("profileSave");
    status.className = "status";
    status.textContent = "저장 중…";
    btn.disabled = true;

    const uploaded = [];
    try {
      const patch = {
        name: trim($("pf_name").value),
        bio: trim($("pf_bio").value),
        interests: trim($("pf_interests").value)
      };

      const avatarFile = window.__pendingAvatar;
      if (avatarFile) {
        checkFile(avatarFile, IMAGE_EXT, "프로필 이미지");
        const path = await uploadFile(avatarFile, "profile/image");
        uploaded.push(path);
        patch.profile_image_url = publicUrl(path);
      }

      const resumeFile = window.__pendingResume;
      if (resumeFile) {
        checkFile(resumeFile, RESUME_EXT, "이력서");
        const path = await uploadFile(resumeFile, "resumes");
        uploaded.push(path);
        patch.resume_url = publicUrl(path);
      }

      let res;
      if (state.profile && state.profile.id) {
        res = await supa.from("profile").update(patch).eq("id", state.profile.id).select().single();
      } else {
        res = await supa.from("profile").insert(patch).select().single();
      }
      if (res.error) throw res.error;

      state.profile = res.data;
      state.profileDraft = null;   // 저장했으므로 임시 보관값을 비웁니다
      window.__pendingAvatar = null;
      window.__pendingResume = null;
      if (state.localAvatar) { URL.revokeObjectURL(state.localAvatar); state.localAvatar = null; }
      if (state.localResume) { URL.revokeObjectURL(state.localResume.url); state.localResume = null; }
      renderMain();
      const ok = $("profileStatus");
      if (ok) { ok.className = "status is-ok"; ok.textContent = "저장했습니다."; }
    } catch (e) {
      // 실패하면 입력한 내용은 그대로 두고, 방금 올린 파일만 지웁니다.
      await removeUploaded(uploaded);
      status.className = "status is-error";
      status.textContent = "저장하지 못했습니다: " + (e.message || e);
      btn.disabled = false;
    }
  }

  /* ══════════════════════════════════════════════════════════════════
     Create / Edit 페이지 (관리자 전용)
     ══════════════════════════════════════════════════════════════════ */

  const BANNERS = {
    game: "Editing game. Saving will update the existing entry. Choosing a new cover image or video replaces it; leave empty to keep current media.",
    paper: "Editing paper. Saving will update the existing entry. Choosing a new cover image or PDF replaces it; leave empty to keep the current file.",
    record: "Editing record. Saving will update the existing entry. Choosing a new cover image replaces it; leave empty to keep the current one."
  };

  function field(id, label, value, type) {
    return '<div class="field"><label for="' + id + '">' + esc(label) + '</label>' +
           '<input type="' + (type || "text") + '" id="' + id + '" value="' + esc(value || "") + '"></div>';
  }
  function area(id, label, value) {
    return '<div class="field"><label for="' + id + '">' + esc(label) + '</label>' +
           '<textarea id="' + id + '">' + esc(value || "") + '</textarea></div>';
  }
  function fileField(id, label, accept, note) {
    return '<div class="field"><label for="' + id + '">' + esc(label) + '</label>' +
           '<input type="file" id="' + id + '" accept="' + esc(accept) + '">' +
           (note ? '<div class="hint">' + esc(note) + '</div>' : "") + '</div>';
  }

  function createPage() {
    const kind = state.formKind;
    const editing = state.editing && state.editing.kind === kind ? state.editing.row : null;
    const d = state.draft;

    // 편집 중이면 그 행의 값, 아니면 종류를 바꿔도 남아 있는 공통 입력값을 씁니다.
    const title = editing ? editing.title : d.title;
    const desc = editing ? (kind === "paper" ? editing.abstract : editing.description) : d.description;
    const year = editing ? editing.year : d.year;

    let html = '<div class="page-head"><h1>' +
               (editing ? "Edit " + KINDS[kind].label : "Create") + '</h1></div>';

    html += '<div class="segmented">' + Object.keys(KINDS).map(function (k) {
      return '<button class="btn' + (k === kind ? " is-active" : " btn-quiet") +
             '" data-kind-switch="' + k + '">' + esc(KINDS[k].label) + '</button>';
    }).join("") + '</div>';

    if (editing) {
      html += '<div class="notice"><span>' + esc(BANNERS[kind]) + '</span></div>';
    }

    html += '<div class="form">';
    html += field("f_title", "Title", title);

    if (kind === "game") {
      html += field("f_year", "Year", year);
      html += field("f_role", "Role", editing ? editing.role : "");
      html += field("f_type", "Project type", editing ? editing.project_type : "");
      html += area("f_desc", "Description", desc);
      html += field("f_link", "Link (optional)", editing ? editing.link_url : "");
      html += fileField("f_cover", "Cover image", ".png,.jpg,.jpeg,.webp", ".png · .jpg · .jpeg · .webp");
      html += fileField("f_video", "Video file", ".mp4", ".mp4 만 가능합니다. 파일을 고르면 아래 주소보다 우선합니다.");
      html += field("f_videourl", "Video URL (YouTube 또는 직접 주소)",
                    editing ? (trim(editing.youtube_url) || trim(editing.video_url)) : "");
      if (editing && trim(editing.video_url)) html += '<div class="hint">(current video kept)</div>';
      if (editing && trim(editing.cover_image_url)) html += '<div class="hint">(current cover kept)</div>';

    } else if (kind === "paper") {
      html += field("f_venue", "Venue", editing ? editing.venue : "");
      html += field("f_year", "Year", year);
      html += area("f_desc", "Abstract", desc);
      html += field("f_keywords", "Keywords (쉼표로 구분)", editing ? editing.keywords : "");
      html += fileField("f_pdf", "PDF file", ".pdf", ".pdf 만 가능합니다.");
      html += field("f_link", "External link (optional)", editing ? editing.link_url : "");
      html += fileField("f_cover", "Cover image (optional)", ".png,.jpg,.jpeg,.webp", ".png · .jpg · .jpeg · .webp");
      if (editing && trim(editing.pdf_url)) html += '<div class="hint">(current PDF kept)</div>';
      if (editing && trim(editing.cover_image_url)) html += '<div class="hint">(current cover kept)</div>';

    } else {
      html += field("f_url", "URL (필수)", editing ? editing.url : "");
      html += area("f_desc", "Description", desc);
      html += field("f_source", "Source", editing ? editing.source : "");
      html += field("f_year", "Year", year);
      html += fileField("f_cover", "Cover image (optional)", ".png,.jpg,.jpeg,.webp", ".png · .jpg · .jpeg · .webp");
      if (editing && trim(editing.cover_image_url)) html += '<div class="hint">(current cover kept)</div>';
    }

    html += '<div class="form-actions">' +
              '<button class="btn" id="submitBtn">' + (editing ? "Update" : "Save") + '</button>' +
              (editing ? '<button class="btn btn-quiet" id="cancelBtn">Cancel edit</button>' : "") +
            '</div>';
    html += '<div class="status" id="formStatus"></div>';
    html += '</div>';
    return html;
  }

  /* 종류를 바꿔도 공통 입력(제목·설명·연도)은 지우지 않습니다. */
  function captureDraft() {
    const t = $("f_title"), de = $("f_desc"), y = $("f_year");
    if (t) state.draft.title = t.value;
    if (de) state.draft.description = de.value;
    if (y) state.draft.year = y.value;
  }

  function startEdit(kind, row) {
    state.editing = { kind: kind, row: row };
    state.formKind = kind;
    state.page = "create";
    render();
    toTop();
  }

  function resetForm() {
    state.editing = null;
    state.draft = { title: "", description: "", year: "" };
  }

  function bindCreate() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-kind-switch]"), function (b) {
      b.addEventListener("click", function () {
        const next = b.getAttribute("data-kind-switch");
        if (next === state.formKind) return;
        captureDraft();
        state.editing = null;   // 종류를 바꾸면 편집 대상이 달라지므로 편집을 끝냅니다
        state.formKind = next;
        renderMain();
      });
    });

    const cancel = $("cancelBtn");
    if (cancel) cancel.addEventListener("click", function () {
      const page = KINDS[state.formKind].page;
      resetForm();
      go(page);
    });

    const submit = $("submitBtn");
    if (submit) submit.addEventListener("click", submitForm);
  }

  async function submitForm() {
    const kind = state.formKind;
    const conf = KINDS[kind];
    const editing = state.editing && state.editing.kind === kind ? state.editing.row : null;
    const status = $("formStatus");
    const submit = $("submitBtn");

    status.className = "status";
    status.textContent = "저장 중…";
    submit.disabled = true;

    const uploaded = [];
    try {
      const title = trim($("f_title").value);
      if (!title) throw new Error("Title 을 입력해 주세요.");

      const row = { title: title };
      const coverInput = $("f_cover");
      const coverFile = coverInput && coverInput.files[0];
      if (coverFile) {
        checkFile(coverFile, IMAGE_EXT, "표지 이미지");
        const path = await uploadFile(coverFile, conf.folder);
        uploaded.push(path);
        row.cover_image_url = publicUrl(path);
      }

      if (kind === "game") {
        row.description = trim($("f_desc").value) || null;
        row.year = trim($("f_year").value) || null;
        row.role = trim($("f_role").value) || null;
        row.project_type = trim($("f_type").value) || null;

        const link = normalizeUrl($("f_link").value);
        if (!link.ok) throw new Error("Link 주소가 올바르지 않습니다. http:// 또는 https:// 주소를 넣어 주세요.");
        row.link_url = link.value;

        const videoInput = $("f_video");
        const videoFile = videoInput && videoInput.files[0];
        const rawVideoUrl = trim($("f_videourl").value);

        if (videoFile) {
          // 새로 올린 파일이 주소보다 우선합니다. 쓰지 않는 칸은 비웁니다.
          checkFile(videoFile, VIDEO_EXT, "영상");
          const path = await uploadFile(videoFile, "videos");
          uploaded.push(path);
          row.video_url = publicUrl(path);
          row.youtube_url = null;
        } else if (rawVideoUrl) {
          const yid = youtubeId(rawVideoUrl);
          if (yid) {
            row.youtube_url = rawVideoUrl;
            row.video_url = null;
          } else {
            const direct = normalizeUrl(rawVideoUrl);
            if (!direct.ok) throw new Error("Video URL 이 올바르지 않습니다.");
            row.video_url = direct.value;
            row.youtube_url = null;
          }
        } else if (!editing) {
          row.video_url = null;
          row.youtube_url = null;
        } else {
          // 편집 중에 주소를 모두 지웠다면 그대로 비웁니다.
          row.video_url = null;
          row.youtube_url = null;
        }

      } else if (kind === "paper") {
        row.venue = trim($("f_venue").value) || null;
        row.year = trim($("f_year").value) || null;
        row.abstract = trim($("f_desc").value) || null;
        row.keywords = trim($("f_keywords").value) || null;

        const link = normalizeUrl($("f_link").value);
        if (!link.ok) throw new Error("External link 주소가 올바르지 않습니다.");
        row.link_url = link.value;

        const pdfInput = $("f_pdf");
        const pdfFile = pdfInput && pdfInput.files[0];
        if (pdfFile) {
          checkFile(pdfFile, [".pdf"], "PDF");
          const path = await uploadFile(pdfFile, "papers");
          uploaded.push(path);
          row.pdf_url = publicUrl(path);
        }

      } else {
        const url = normalizeUrl($("f_url").value);
        if (!trim($("f_url").value)) throw new Error("URL 을 입력해 주세요.");
        if (!url.ok) throw new Error("URL 이 올바르지 않습니다. http:// 또는 https:// 주소여야 합니다.");
        row.url = url.value;
        row.description = trim($("f_desc").value) || null;
        row.source = trim($("f_source").value) || null;
        row.year = trim($("f_year").value) || null;
      }

      let res;
      if (editing) {
        res = await supa.from(conf.table).update(row).eq("id", editing.id).select().single();
      } else {
        res = await supa.from(conf.table).insert(row).select().single();
      }
      if (res.error) throw res.error;

      resetForm();
      await loadAll();
      go(conf.page);
    } catch (e) {
      // 실패하면 입력한 글과 고른 파일은 그대로 두고, 방금 올린 파일만 지웁니다.
      await removeUploaded(uploaded);
      status.className = "status is-error";
      status.textContent = "저장하지 못했습니다: " + (e.message || e);
      submit.disabled = false;
    }
  }

  /* ══════════════════════════════════════════════════════════════════
     관리자 로그인
     ══════════════════════════════════════════════════════════════════ */

  function loginPage() {
    return '<div class="page-head"><h1>Admin</h1></div>' +
           '<div class="login-card">' +
             '<div class="field"><label for="lg_email">Email</label>' +
               '<input type="email" id="lg_email" autocomplete="username"></div>' +
             '<div class="field"><label for="lg_pw">Password</label>' +
               '<input type="password" id="lg_pw" autocomplete="current-password"></div>' +
             '<div class="form-actions"><button class="btn" id="loginBtn">Log in</button></div>' +
             '<div class="status" id="loginStatus"></div>' +
             '<div class="hint">비밀번호는 이 화면에서만 입력받으며 어디에도 저장하지 않습니다.</div>' +
           '</div>';
  }

  function bindLogin() {
    const btn = $("loginBtn");
    if (!btn) return;
    async function attempt() {
      const status = $("loginStatus");
      status.className = "status";
      status.textContent = "확인 중…";
      btn.disabled = true;
      try {
        if (!supa) throw new Error("Supabase 에 연결되어 있지 않습니다.");
        const { data, error } = await supa.auth.signInWithPassword({
          email: trim($("lg_email").value),
          password: $("lg_pw").value
        });
        if (error) throw error;
        if (!data.user || data.user.id !== VITE_ADMIN_UID) {
          await supa.auth.signOut();
          throw new Error("관리자 계정이 아닙니다.");
        }
        await applySession(data.session);
        go("create");
      } catch (e) {
        const status2 = $("loginStatus");
        if (status2) {
          status2.className = "status is-error";
          status2.textContent = "로그인하지 못했습니다: " + (e.message || e);
        }
        btn.disabled = false;
      }
    }
    btn.addEventListener("click", attempt);
    ["lg_email", "lg_pw"].forEach(function (id) {
      const input = $(id);
      if (input) input.addEventListener("keydown", function (e) { if (e.key === "Enter") attempt(); });
    });
  }

  async function applySession(session) {
    state.session = session || null;
    state.isAdmin = Boolean(session && session.user && session.user.id === VITE_ADMIN_UID);
    await loadAll();
  }

  /* ══════════════════════════════════════════════════════════════════
     그리기
     ══════════════════════════════════════════════════════════════════ */

  function renderMain() {
    const main = $("main");
    let html;
    switch (state.page) {
      case "games":   html = listPage("game", "Games", "게임 프로젝트"); break;
      case "papers":  html = listPage("paper", "Papers", "게임 논문과 발표"); break;
      case "records": html = listPage("record", "Records", "내 글과 내 작업이 언급된 곳"); break;
      case "create":  html = state.isAdmin ? createPage() : loginPage(); break;
      default:        html = profilePage();
    }
    main.innerHTML = html;

    bindHoverVideos(main);
    if (state.page === "create") { state.isAdmin ? bindCreate() : bindLogin(); }
    if (state.page === "profile") bindProfile();

    Array.prototype.forEach.call(main.querySelectorAll(".card"), function (card) {
      card.addEventListener("click", function () {
        openModal(card.getAttribute("data-kind"), card.getAttribute("data-id"));
      });
    });
  }

  function render() {
    renderChrome();
    renderSidebar();
    renderMain();
  }

  /* 사이드바 이동 */
  $("sidebar").addEventListener("click", function (e) {
    const btn = e.target.closest("[data-go]");
    if (btn) go(btn.getAttribute("data-go"));
  });

  /* 푸터의 Admin 링크 */
  $("adminLink").addEventListener("click", function () { go("create"); });

  /* 시작 */
  (async function boot() {
    render();
    if (supa) {
      try {
        const { data } = await supa.auth.getSession();
        state.session = (data && data.session) || null;
        state.isAdmin = Boolean(state.session && state.session.user &&
                                state.session.user.id === VITE_ADMIN_UID);
      } catch (e) { /* 세션이 없으면 방문자로 봅니다 */ }

      supa.auth.onAuthStateChange(function (_event, session) {
        const wasAdmin = state.isAdmin;
        state.session = session || null;
        state.isAdmin = Boolean(session && session.user && session.user.id === VITE_ADMIN_UID);
        if (wasAdmin !== state.isAdmin) render();
      });
    }
    await loadAll();
    render();
  })();
})();
</script>
</body>
</html>
